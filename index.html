<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Concurso Halime</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --rose:#c2607a;--rose-lt:#fdf0f4;--gold:#c9a96e;--gold-lt:#f5ede0;
  --nude:#f2ebe4;--nude-dk:#e0d4c8;--dark:#2d1a24;--mid:#7a5a68;
  --soft:#b09aa8;--white:#fff;--off:#faf7f5;
  --shadow:0 4px 32px rgba(120,60,80,.10);
  --shadow-lg:0 12px 60px rgba(120,60,80,.16);
  --r:14px;--r-lg:22px;--r-xl:32px;
}
body{font-family:'DM Sans',sans-serif;background:linear-gradient(175deg,#fff9f7 0%,#fdf0f4 40%,#f8ede5 100%);min-height:100vh;color:var(--dark)}
.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 16px 48px}
.logo-wrap{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(201,169,110,.12),transparent 70%);display:flex;align-items:center;justify-content:center;margin:40px auto 16px;box-shadow:0 0 0 1px rgba(201,169,110,.15)}
.logo{width:82px;height:82px;object-fit:contain}
.brand{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:5px;text-transform:uppercase;color:var(--gold);text-align:center;margin-bottom:6px}
.card{background:var(--white);border-radius:var(--r-lg);padding:28px 24px;width:100%;max-width:440px;box-shadow:var(--shadow)}
.btn-primary{display:block;width:auto;min-width:220px;margin:0 auto;padding:15px 40px;border-radius:var(--r-xl);border:none;background:linear-gradient(135deg,#c87090,#9a3a58);color:#fff;font-size:14px;font-weight:500;letter-spacing:.4px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .2s,transform .15s;box-shadow:0 6px 24px rgba(160,60,90,.25);text-align:center;text-decoration:none}
.btn-primary:hover{opacity:.93;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;cursor:default;transform:none}
.btn-secondary{display:block;width:auto;min-width:200px;margin:10px auto 0;padding:13px 36px;border-radius:var(--r-xl);border:1.5px solid var(--nude-dk);background:transparent;color:var(--mid);font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.btn-secondary:hover{border-color:var(--rose);color:var(--rose)}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:auto;min-width:240px;margin:0 auto;padding:15px 36px;border-radius:var(--r-xl);border:none;background:linear-gradient(135deg,#4285f4,#1a73e8);color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .2s,transform .15s;box-shadow:0 6px 24px rgba(66,133,244,.30);text-decoration:none}
.btn-google:hover{opacity:.93;transform:translateY(-1px)}
.flabel{display:block;font-size:13px;font-weight:500;color:var(--mid);margin-bottom:7px}
.finp{width:100%;padding:13px 16px;font-size:14px;border:1.5px solid var(--nude-dk);border-radius:var(--r);outline:none;background:#fefcfa;color:var(--dark);transition:border-color .2s;font-family:'DM Sans',sans-serif}
.finp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,169,110,.10)}
.fg{margin-bottom:16px}
.ferr{display:block;font-size:11px;color:var(--rose);margin-top:4px}
.section-title{font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--nude-dk)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:#f7e8ef;padding:12px 24px;border-radius:var(--r-xl);font-size:13px;box-shadow:var(--shadow-lg);z-index:999;opacity:0;transition:opacity .3s;white-space:nowrap}
.toast.show{opacity:1}
.landing-title{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:500;color:var(--dark);text-align:center;line-height:1.2;margin-bottom:10px}
.landing-sub{font-size:14px;color:var(--mid);text-align:center;line-height:1.75;max-width:300px;margin:0 auto 28px;font-weight:300}
.prize-box{background:linear-gradient(135deg,rgba(201,169,110,.10),rgba(194,96,122,.06));border:1px solid rgba(201,169,110,.28);border-radius:20px;padding:20px 24px;text-align:center;margin-bottom:28px;width:100%;max-width:440px}
.prize-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.prize-val{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:400;color:var(--mid);line-height:1.4}
.prize-highlight{font-family:'Times New Roman',Times,serif;font-size:24px;font-weight:400;letter-spacing:.4px;line-height:1.3;display:block;margin-top:8px;color:#b8860b}
.steps{width:100%;max-width:440px;margin-bottom:28px}
.step{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.step-num{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,rgba(201,169,110,.15),rgba(201,169,110,.05));border:1px solid rgba(201,169,110,.3);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;color:var(--gold);flex-shrink:0;margin-top:2px}
.step-text{font-size:13px;color:var(--mid);line-height:1.65}
.step-text strong{color:var(--dark);font-weight:500}
.stars-highlight{color:var(--gold);font-weight:600;letter-spacing:.5px;white-space:nowrap}
.reg-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:500;text-align:center;margin-bottom:6px}
.reg-sub{font-size:13px;color:var(--soft);text-align:center;margin-bottom:24px;line-height:1.6}
.afiliado-row{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.afiliado-row .finp{flex:1}
.afiliado-num{font-size:12px;color:var(--soft);width:20px;text-align:right;flex-shrink:0;font-family:'Cormorant Garamond',serif}
.btn-add{display:flex;align-items:center;gap:6px;background:none;border:1.5px dashed var(--nude-dk);color:var(--soft);font-size:13px;padding:10px 16px;border-radius:var(--r);cursor:pointer;width:100%;justify-content:center;margin-top:4px;transition:all .2s;font-family:'DM Sans',sans-serif}
.btn-add:hover{border-color:var(--gold);color:var(--gold)}
.btn-del{background:none;border:none;color:var(--nude-dk);cursor:pointer;font-size:18px;padding:4px;line-height:1;transition:color .2s;flex-shrink:0}
.btn-del:hover{color:var(--rose)}
.afil-section{margin-top:20px}
.rank-header{text-align:center;width:100%;max-width:440px;margin-bottom:20px}
.rank-title{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:500;margin-bottom:4px}
.rank-sub{font-size:13px;color:var(--soft)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-bottom:16px;width:100%;max-width:440px}
.podium-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.podium-avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--white)}
.podium-avatar.p1{width:64px;height:64px;background:linear-gradient(135deg,#c9a96e,#e8c878);font-size:24px;box-shadow:0 4px 20px rgba(201,169,110,.35)}
.podium-avatar.p2{background:linear-gradient(135deg,#b0b8c4,#8090a0)}
.podium-avatar.p3{background:linear-gradient(135deg,#c9855a,#a06040)}
.podium-name{font-size:11px;color:var(--mid);text-align:center;max-width:70px;line-height:1.3;font-weight:500}
.podium-pts{font-size:12px;color:var(--gold);font-weight:600}
.podium-bar{border-radius:8px 8px 0 0;width:72px}
.podium-bar.b1{height:90px;background:linear-gradient(180deg,rgba(201,169,110,.25),rgba(201,169,110,.08))}
.podium-bar.b2{height:60px;background:linear-gradient(180deg,rgba(176,184,196,.2),rgba(176,184,196,.05))}
.podium-bar.b3{height:42px;background:linear-gradient(180deg,rgba(201,133,90,.2),rgba(201,133,90,.05))}
.rank-list{width:100%;max-width:440px}
.rank-item{background:var(--white);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 12px rgba(120,60,80,.06);transition:transform .2s}
.rank-item:hover{transform:translateX(3px)}
.rank-item.mine{border:1.5px solid rgba(201,169,110,.35);background:linear-gradient(135deg,#fffdf9,#fff8ee)}
.rank-pos{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--soft);width:28px;text-align:center;flex-shrink:0}
.rank-pos.gold{color:var(--gold)}
.rank-pos.silver{color:#909aaa}
.rank-pos.bronze{color:#c9855a}
.rank-info{flex:1}
.rank-name{font-size:14px;font-weight:500;color:var(--dark)}
.rank-detail{font-size:11px;color:var(--soft);margin-top:2px}
.rank-pts{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--gold)}
.rank-pts-label{font-size:10px;color:var(--soft);text-align:right}
.empty-rank{text-align:center;padding:40px 20px;color:var(--soft);font-size:14px}
.my-badge{display:inline-block;font-size:10px;background:linear-gradient(135deg,rgba(201,169,110,.15),rgba(201,169,110,.05));border:1px solid rgba(201,169,110,.3);color:var(--gold);padding:2px 8px;border-radius:20px;margin-left:6px;letter-spacing:.5px}
.rank-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:20px;width:100%;max-width:440px}
.rank-actions .btn-primary{flex:1;min-width:0}
.rank-actions .btn-secondary{flex:1;min-width:0;margin:0}
/* ── NUEVA: aviso desempate y cierre ── */
.concurso-aviso{width:100%;max-width:440px;background:linear-gradient(135deg,rgba(201,169,110,.07),rgba(194,96,122,.04));border:1px solid rgba(201,169,110,.22);border-left:3px solid rgba(201,169,110,.5);border-radius:12px;padding:12px 16px;margin-bottom:18px;display:flex;align-items:flex-start;gap:10px;}
.concurso-aviso-icon{font-size:16px;flex-shrink:0;margin-top:1px;}
.concurso-aviso-body{font-size:11.5px;color:var(--mid);line-height:1.7;}
.concurso-aviso-body strong{color:var(--dark);font-weight:600;display:block;margin-bottom:3px;font-size:12px;}
/* ── /NUEVA ── */
.hist-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:500;text-align:center;margin-bottom:4px}
.hist-sub{font-size:13px;color:var(--soft);text-align:center;margin-bottom:24px}
.hist-item{background:var(--white);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;box-shadow:0 2px 12px rgba(120,60,80,.06);display:flex;gap:12px;align-items:flex-start}
.hist-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.hist-icon.vote{background:rgba(201,169,110,.12)}
.hist-icon.afil{background:rgba(194,96,122,.10)}
.hist-body{flex:1}
.hist-label{font-size:13px;font-weight:500;color:var(--dark);margin-bottom:2px}
.hist-date{font-size:11px;color:var(--soft)}
.hist-pts{font-size:13px;font-weight:600;color:var(--gold);margin-left:auto;flex-shrink:0}
.nav-tabs{display:flex;gap:0;background:rgba(255,255,255,.7);border-radius:var(--r-xl);padding:4px;margin-bottom:20px;width:100%;max-width:440px;box-shadow:0 2px 12px rgba(120,60,80,.06)}
.nav-tab{flex:1;padding:10px;border:none;background:transparent;border-radius:20px;font-size:13px;color:var(--soft);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;font-weight:400}
.nav-tab.active{background:var(--white);color:var(--dark);font-weight:500;box-shadow:0 2px 8px rgba(120,60,80,.08)}
@keyframes pulse-gold{0%,100%{box-shadow:0 4px 16px rgba(160,120,60,.25),0 0 0 0 rgba(201,169,110,.4)}50%{box-shadow:0 6px 24px rgba(160,120,60,.40),0 0 0 8px rgba(201,169,110,0)}}
@keyframes shimmer{0%{transform:translateX(-100%) skewX(-15deg)}100%{transform:translateX(250%) skewX(-15deg)}}
.btn-actualizar{position:relative;overflow:hidden;animation:pulse-gold 2.5s ease-in-out infinite;}
.btn-actualizar::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shimmer 3s ease-in-out infinite;}
.disclaimer{font-size:11px;color:var(--soft);text-align:center;line-height:1.7;max-width:320px;margin:20px auto 0;padding:14px 18px;border-top:1px solid var(--nude-dk);border-radius:var(--r)}
.ref-page{min-height:100vh;background:linear-gradient(175deg,#fff9f7 0%,#fdf0f4 40%,#f8ede5 100%);display:flex;flex-direction:column;align-items:center;padding:0 16px 48px}
.ref-invite{background:linear-gradient(135deg,rgba(201,169,110,.10),rgba(194,96,122,.06));border:1px solid rgba(201,169,110,.28);border-radius:20px;padding:18px 22px;text-align:center;margin-bottom:24px;width:100%;max-width:440px}
.ref-invite-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.ref-invite-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;color:var(--dark);margin-bottom:4px}
.ref-invite-sub{font-size:13px;color:var(--mid)}
.ref-done{min-height:100vh;background:linear-gradient(175deg,#fff9f7,#fdf0f4,#f5e8e0);display:flex;align-items:center;justify-content:center;padding:40px 20px}
.ref-done-inner{max-width:380px;width:100%;text-align:center}
.ref-done-check{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#c9a96e,#e8c090);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 6px 24px rgba(201,169,110,.30)}
.ref-done-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:500;color:var(--dark);margin-bottom:10px;line-height:1.3}
.ref-done-sub{font-size:14px;color:var(--mid);line-height:1.7}
.ref-done-sub strong{color:var(--rose)}
.btn-locked{opacity:.4;cursor:not-allowed!important;position:relative}
.btn-locked::after{content:"🔒";font-size:12px;margin-left:8px}
@keyframes pulse-rose{0%,100%{box-shadow:0 4px 16px rgba(194,96,122,.3),0 0 0 0 rgba(194,96,122,.4)}50%{box-shadow:0 6px 24px rgba(194,96,122,.5),0 0 0 8px rgba(194,96,122,0)}}
@keyframes shimmer-rose{0%{transform:translateX(-100%) skewX(-15deg)}100%{transform:translateX(250%) skewX(-15deg)}}
.btn-confirm-active{width:100%;max-width:440px;padding:15px;border-radius:var(--r-xl);border:none;background:linear-gradient(135deg,#c87090,#9a3a58)!important;color:#fff!important;font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:.4px;animation:pulse-rose 2s ease-in-out infinite;position:relative;overflow:hidden;margin-top:10px;}
.btn-confirm-active::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:shimmer-rose 2.5s ease-in-out infinite;}
.confetti-piece{position:fixed;width:8px;height:8px;top:-10px;border-radius:2px;animation:confetti-fall linear forwards;pointer-events:none;z-index:9999}
@keyframes confetti-fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.adm-page{min-height:100vh;background:#f8f4f6}
.adm-hdr{background:linear-gradient(135deg,#2d1a24,#1a1410);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:10}
.adm-hdr-left{display:flex;align-items:center;gap:12px}
.adm-logo{width:36px;height:36px;object-fit:contain;filter:brightness(1.3)}
.adm-overtitle{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
.adm-title{font-family:'Cormorant Garamond',serif;font-size:17px;color:#f7e8ef}
.adm-btns{display:flex;gap:8px;flex-wrap:wrap}
.adm-btn{padding:7px 14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#f7e8ef;border-radius:var(--r);cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif}
.adm-btn:hover{background:rgba(255,255,255,.18)}
.adm-btn-gold{background:rgba(201,169,110,.18);border-color:rgba(201,169,110,.4);color:var(--gold)}
.adm-body{max-width:800px;margin:0 auto;padding:20px 16px}
.adm-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
.adm-stat{background:var(--white);border-radius:var(--r-lg);padding:18px 16px;text-align:center;box-shadow:var(--shadow)}
.adm-stat-val{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;margin-bottom:4px}
.adm-stat-lbl{font-size:11px;color:var(--soft);letter-spacing:.5px}
.adm-section{background:var(--white);border-radius:var(--r-lg);padding:20px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.adm-section-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.adm-row{border-bottom:1px solid var(--nude);padding:14px 0;display:flex;align-items:flex-start;gap:14px}
.adm-row:last-child{border-bottom:none;padding-bottom:0}
.adm-pos{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--soft);width:28px;text-align:center;flex-shrink:0;margin-top:2px}
.adm-pos.gold{color:var(--gold)}
.adm-pos.silver{color:#909aaa}
.adm-pos.bronze{color:#c9855a}
.adm-info{flex:1}
.adm-name{font-size:14px;font-weight:500;color:var(--dark);margin-bottom:4px}
.adm-afils{font-size:12px;color:var(--soft);line-height:1.6}
.adm-afil-item{display:inline-block;background:var(--nude);border-radius:20px;padding:2px 10px;margin:2px 3px 2px 0;font-size:11px;color:var(--mid)}
.adm-pts{text-align:right;flex-shrink:0}
.adm-pts-val{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--gold)}
.adm-pts-lbl{font-size:10px;color:var(--soft)}
.adm-date{font-size:10px;color:var(--nude-dk);margin-top:4px}
.adm-del{padding:4px 10px;border-radius:20px;border:1px solid #f0c0c8;background:transparent;color:#c05060;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:6px}
.adm-del:hover{background:#fdf0f0}
.adm-edit{padding:4px 10px;border-radius:20px;border:1px solid rgba(201,169,110,.4);background:transparent;color:var(--gold);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:6px;margin-left:6px}
.adm-edit:hover{background:rgba(201,169,110,.08)}
.modal-overlay{position:fixed;inset:0;background:rgba(45,26,36,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:#fff;border-radius:var(--r-lg);padding:24px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;color:var(--dark);margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--soft);margin-bottom:18px}
.modal-afil-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.modal-afil-inp{flex:1;padding:9px 12px;font-size:13px;border:1.5px solid var(--nude-dk);border-radius:var(--r);outline:none;font-family:'DM Sans',sans-serif;color:var(--dark)}
.modal-afil-inp:focus{border-color:var(--gold)}
.modal-afil-del{background:none;border:none;color:var(--nude-dk);cursor:pointer;font-size:18px;padding:4px;flex-shrink:0}
.modal-afil-del:hover{color:var(--rose)}
.modal-add{display:flex;align-items:center;gap:6px;background:none;border:1.5px dashed var(--nude-dk);color:var(--soft);font-size:12px;padding:8px 14px;border-radius:var(--r);cursor:pointer;width:100%;justify-content:center;margin-top:4px;font-family:'DM Sans',sans-serif}
.modal-add:hover{border-color:var(--gold);color:var(--gold)}
.modal-btns{display:flex;gap:8px;margin-top:20px}
.modal-save{flex:1;padding:12px;border-radius:var(--r-xl);border:none;background:linear-gradient(135deg,#c87090,#9a3a58);color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif}
.modal-cancel{flex:1;padding:12px;border-radius:var(--r-xl);border:1.5px solid var(--nude-dk);background:transparent;color:var(--soft);font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif}
</style>
</head>
<body>

async function sbGet(query=""){const r=await fetch(`${SB_URL}/rest/v1/${TABLE}${query}`,{headers:SB_HEADERS});if(!r.ok)throw new Error(await r.text());return r.json()}
async function sbInsert(row){const r=await fetch(`${SB_URL}/rest/v1/${TABLE}`,{method:"POST",headers:{...SB_HEADERS,"Prefer":"return=representation"},body:JSON.stringify(row)});if(!r.ok)throw new Error(await r.text());return r.json()}
async function sbGetByRef(refCode){const r=await fetch(`${SB_URL}/rest/v1/${TABLE}?ref_code=eq.${encodeURIComponent(refCode)}&limit=1`,{headers:SB_HEADERS});if(!r.ok)throw new Error(await r.text());const data=await r.json();return data[0]||null}
async function sbDeleteParticipante(id){const r=await fetch(`${SB_URL}/rest/v1/${TABLE}?id=eq.${id}`,{method:"DELETE",headers:SB_HEADERS});if(!r.ok)throw new Error(await r.text())}
async function sbUpdate(id,patch){const r=await fetch(`${SB_URL}/rest/v1/${TABLE}?id=eq.${id}`,{method:"PATCH",headers:SB_HEADERS,body:JSON.stringify(patch)});if(!r.ok)throw new Error(await r.text())}
let S={page:"landing",tab:"ranking",me:null,all:[],loading:false,regStep:1,adminAuth:false,adminPass:"",adminPassErr:false,refCode:null,refOwner:null};
function set(p){S={...S,...p};R()}
function el(tag,at,...ch){const e=document.createElement(tag);if(at)for(const[k,v]of Object.entries(at)){if(k==="cls")e.className=v;else if(k==="on")for(const[ev,fn]of Object.entries(v))e.addEventListener(ev,fn);else if(k==="style"&&typeof v==="object")Object.assign(e.style,v);else e.setAttribute(k,v)}for(const c of ch.flat(9)){if(c==null||c===false)continue;e.appendChild(typeof c==="string"?document.createTextNode(c):c)}return e}
function toast(msg){let t=document.getElementById("_toast");if(!t){t=el("div",{cls:"toast",id:"_toast"});document.body.appendChild(t)}t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500)}
function logoHeader(){const w=el("div",{});w.appendChild(el("div",{cls:"logo-wrap"},el("img",{cls:"logo",src:LOGO,alt:"Halime"})));w.appendChild(el("div",{cls:"brand"},"Halime · Estética Médica"));return w}
function initials(nombre,apellido){return((nombre||"").charAt(0)+(apellido||"").charAt(0)).toUpperCase()}
function puntos(p){return 1+(p.afiliados||[]).length}

function pageLanding(){
  const page=el("div",{cls:"page"});
  page.appendChild(logoHeader());
  page.appendChild(el("h1",{cls:"landing-title"},"Concurso Halime"));
  page.appendChild(el("p",{cls:"landing-sub"},"Sumá votos de amigos y familia, escalá en el ranking y ganá tu próxima sesión completamente gratis."));
  const prize=el("div",{cls:"prize-box"});
  prize.appendChild(el("div",{cls:"prize-label"},"Premio"));
  const pv=el("div",{cls:"prize-val"},"La persona con más puntos gana");
  pv.appendChild(el("span",{cls:"prize-highlight"},"Su próxima sesión, completamente gratis."));
  prize.appendChild(pv);page.appendChild(prize);
  const steps=el("div",{cls:"steps"});
  const step1=el("div",{cls:"step"});
  step1.appendChild(el("div",{cls:"step-num"},"1"));
  const t1=el("div",{cls:"step-text"});
  t1.appendChild(el("strong",{},"Votá en Google — "));
  t1.appendChild(document.createTextNode("Dejá tu reseña de "));
  t1.appendChild(el("span",{cls:"stars-highlight"},"5 estrellas ★★★★★"));
  t1.appendChild(document.createTextNode(" en nuestro perfil de Google."));
  step1.appendChild(t1);
  const pts1=el("div",{style:{fontSize:"12px",color:"var(--soft)",marginTop:"6px",paddingLeft:"46px"}},"5★ = 1 punto");
  step1.appendChild(pts1);steps.appendChild(step1);
  [["2","Registrá tu voto","Volvé acá, ingresá tu nombre y obtené tu link personal para compartir."],
   ["3","Compartí tu link","Mandáselo a amigos y familia. Cada uno que vote con 5 ★ por vos suma 1 punto más a tu posición."]
  ].forEach(([n,title,desc])=>{const s=el("div",{cls:"step"});s.appendChild(el("div",{cls:"step-num"},n));const t=el("div",{cls:"step-text"});t.appendChild(el("strong",{},title+" — "));t.appendChild(document.createTextNode(desc));s.appendChild(t);steps.appendChild(s)});
  page.appendChild(steps);
  const voted=localStorage.getItem("halime_voted");
  const registered=localStorage.getItem("halime_registered");
  const ga=el("a",{cls:"btn-google",href:GOOGLE_URL,target:"_blank"},"⭐  Votar en Google");
  ga.addEventListener("click",()=>{setTimeout(()=>{localStorage.setItem("halime_voted","1");already.classList.remove("btn-locked");already.disabled=false;already.title=""},800)});
  page.appendChild(ga);
  const alreadyLocked=!!registered;
  const alreadyText=alreadyLocked?"✓  Ya registraste tu participación":"Registrar mi participación";
  const already=el("button",{cls:"btn-secondary"+(!voted||alreadyLocked?" btn-locked":"")},alreadyText);
  already.disabled=!voted||alreadyLocked;
  if(!voted&&!alreadyLocked)already.title="Primero votá en Google";
  already.addEventListener("click",()=>{if(!localStorage.getItem("halime_voted")||localStorage.getItem("halime_registered"))return;set({page:"register",regStep:1})});
  page.appendChild(already);
  const rank=el("button",{cls:"btn-secondary"+(registered?"":" btn-locked"),style:{marginTop:"6px"}},"Ver Ranking");
  rank.disabled=!registered;
  if(!registered)rank.title="Primero registrá tu participación";
  rank.addEventListener("click",async()=>{if(!localStorage.getItem("halime_registered"))return;set({loading:true});try{const all=await sbGet("?order=puntos.desc");set({all,loading:false,page:"ranking"})}catch{set({loading:false});toast("Error al cargar ranking.")}});
  page.appendChild(rank);
  const disc=el("div",{cls:"disclaimer"},"* El premio es válido únicamente para la próxima jornada de Halime. En caso de no poder concretarse, pasará al participante en la posición inmediatamente anterior.");
  page.appendChild(disc);
  return page;
}

function pageRegister(){
  const page=el("div",{cls:"page"});
  page.appendChild(logoHeader());
  const LF={nombre:"",apellido:"",afiliados:[]};
  page.appendChild(el("h2",{cls:"reg-title"},"Registrar participación"));
  page.appendChild(el("p",{cls:"reg-sub"},"Ingresá tu nombre completo para registrar tu participación y obtener tu link personal para compartir."));
  const card=el("div",{cls:"card"});
  card.appendChild(el("div",{cls:"section-title"},"Tus datos"));
  const fgNombre=el("div",{cls:"fg"});
  fgNombre.appendChild(el("label",{cls:"flabel"},"Tu nombre"));
  const inpNombre=el("input",{cls:"finp",type:"text",placeholder:"Nombre"});
  inpNombre.addEventListener("input",ev=>LF.nombre=ev.target.value);
  fgNombre.appendChild(inpNombre);card.appendChild(fgNombre);
  const fgApellido=el("div",{cls:"fg"});
  fgApellido.appendChild(el("label",{cls:"flabel"},"Tu apellido"));
  const inpApellido=el("input",{cls:"finp",type:"text",placeholder:"Apellido"});
  inpApellido.addEventListener("input",ev=>LF.apellido=ev.target.value);
  fgApellido.appendChild(inpApellido);card.appendChild(fgApellido);
  const submitBtn=el("button",{cls:"btn-primary",style:{marginTop:"24px"}},"Registrar y obtener mi link");
  submitBtn.addEventListener("click",async()=>{
    if(!LF.nombre.trim()||!LF.apellido.trim()){toast("Ingresá tu nombre y apellido completo.");return}
    const afilValidos=[];
    submitBtn.textContent="Verificando…";submitBtn.disabled=true;
    try{
      const apellidoNorm=LF.apellido.trim().toLowerCase();
      const existing=await sbGet("?order=id.asc");
      const duplicate=existing.find(p=>p.apellido&&p.apellido.toLowerCase()===apellidoNorm);
      if(duplicate){submitBtn.textContent="Registrar y obtener mi link";submitBtn.disabled=false;toast("Ya existe un participante con ese apellido.");return}
      submitBtn.textContent="Registrando…";
      const refCode=(LF.nombre.trim().toLowerCase().replace(/\s+/g,"-")+"-"+LF.apellido.trim().toLowerCase().replace(/\s+/g,"-")+"-"+Math.random().toString(36).substr(2,4));
      const data=await sbInsert({nombre:LF.nombre.trim(),apellido:LF.apellido.trim(),afiliados:afilValidos,puntos:1+afilValidos.length,ts:new Date().toISOString(),ref_code:refCode});
      const me=Array.isArray(data)?data[0]:data;
      const all=await sbGet("?order=puntos.desc");
      localStorage.setItem("halime_registered","1");
      localStorage.setItem("halime_my_id",String(me.id));
      localStorage.setItem("halime_my_ref",refCode);
      set({me,all,page:"ranking",tab:"ranking",loading:false});
      setTimeout(launchConfetti,200);
    } catch(e){submitBtn.textContent="Registrar y obtener mi link";submitBtn.disabled=false;toast("Error al registrar: "+e.message)}
  });
  card.appendChild(submitBtn);
  const back=el("button",{cls:"btn-secondary"},"← Volver");
  back.addEventListener("click",()=>set({page:"landing"}));
  card.appendChild(back);
  page.appendChild(card);
  return page;
}

function pageRanking(){
  const page=el("div",{cls:"page"});
  page.appendChild(logoHeader());
  page.appendChild(rankingView());
  return page;
}

function rankingView(){
  const wrap=el("div",{style:{width:"100%",maxWidth:"440px"}});
  const sorted=[...S.all].sort((a,b)=>(b.puntos||0)-(a.puntos||0));
  wrap.appendChild(el("h2",{cls:"rank-title",style:{textAlign:"center",width:"100%"}},"Tabla de posiciones"));

  // Podio top 3
  if(sorted.length>=1){
    const podium=el("div",{cls:"podium"});
    const order=sorted.length===1?[sorted[0]]:sorted.length===2?[sorted[1],sorted[0]]:[sorted[1],sorted[0],sorted[2]];
    const configs=[{cls:"p2",bar:"b2",num:"2",numColor:"#909aaa"},{cls:"p1",bar:"b1",num:"1",numColor:"#BA7517"},{cls:"p3",bar:"b3",num:"3",numColor:"#c9855a"}];
    order.forEach((p,i)=>{
      if(!p)return;
      const cfg=configs[i];
      const item=el("div",{cls:"podium-item"});
      item.appendChild(el("div",{cls:"podium-pts"},String(p.puntos||0)+" pts"));
      item.appendChild(el("div",{cls:"podium-avatar "+cfg.cls},initials(p.nombre,p.apellido)));
      item.appendChild(el("div",{cls:"podium-name"},p.nombre+" "+p.apellido));
      const bar=el("div",{cls:"podium-bar "+cfg.bar});
      const num=el("div",{style:{fontFamily:"'Cormorant Garamond',Georgia,serif",fontSize:cfg.num==="1"?"36px":cfg.num==="2"?"28px":"22px",fontWeight:"600",color:cfg.numColor,textAlign:"center",lineHeight:"1",paddingTop:cfg.num==="1"?"18px":cfg.num==="2"?"14px":"10px"}},cfg.num);
      bar.appendChild(num);item.appendChild(bar);podium.appendChild(item);
    });
    wrap.appendChild(podium);
  } else {
    wrap.appendChild(el("div",{cls:"empty-rank"},"Todavía no hay participantes. ¡Sé el primero!"));
  }

  // ── AVISO DESEMPATE Y CIERRE (NUEVO) ──
  const aviso=el("div",{cls:"concurso-aviso"});

  const avisoBody=el("div",{cls:"concurso-aviso-body"});
  avisoBody.appendChild(document.createTextNode("En caso de empate de puntaje, gana quien llegó primero a esa puntuación. El concurso finaliza el 13/06 a las 00:00 hs."));
  aviso.appendChild(avisoBody);
  wrap.appendChild(aviso);
  // ── /AVISO ──

  // Card personal
  if(S.me){
    const myPos=sorted.findIndex(p=>p.id===S.me.id)+1;
    const card=el("div",{style:{background:"linear-gradient(135deg,rgba(201,169,110,.08),rgba(201,169,110,.03))",border:"1px solid rgba(201,169,110,.28)",borderLeft:"3px solid #c9a96e",borderRadius:"16px",padding:"18px 18px",marginTop:"4px",width:"100%"}});
    card.appendChild(el("div",{style:{fontSize:"10px",letterSpacing:"2px",textTransform:"uppercase",color:"var(--gold)",marginBottom:"12px"}},"Tu posición"));
    const top=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"14px"}});
    const left=el("div",{});
    const nameRow=el("div",{style:{display:"flex",alignItems:"center",gap:"6px"}});
    nameRow.appendChild(el("span",{style:{fontSize:"15px",fontWeight:"500",color:"var(--dark)"}},S.me.nombre+" "+S.me.apellido));
    nameRow.appendChild(el("span",{cls:"my-badge"},"vos"));
    left.appendChild(nameRow);
    left.appendChild(el("div",{style:{fontSize:"12px",color:"var(--soft)",marginTop:"3px"}},"Posición #"+String(myPos)));
    top.appendChild(left);
    const right=el("div",{style:{textAlign:"right"}});
    right.appendChild(el("div",{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:"30px",fontWeight:"600",color:"var(--gold)"}},String(S.me.puntos||0)));
    right.appendChild(el("div",{style:{fontSize:"10px",color:"var(--soft)"}},"puntos"));
    top.appendChild(right);card.appendChild(top);
    const afils=S.me.afiliados||[];
    if(afils.length){
      const afilSection=el("div",{style:{borderTop:"1px solid rgba(201,169,110,.15)",paddingTop:"12px"}});
      afilSection.appendChild(el("div",{style:{fontSize:"11px",color:"var(--soft)",marginBottom:"8px"}},String(afils.length)+" afiliado"+(afils.length!==1?"s":"")+" confirmado"+(afils.length!==1?"s":"")));
      const pills=el("div",{style:{display:"flex",flexWrap:"wrap",gap:"6px"}});
      afils.forEach(a=>{pills.appendChild(el("span",{style:{background:"rgba(201,169,110,.08)",border:"0.5px solid rgba(201,169,110,.2)",borderRadius:"20px",padding:"3px 10px",fontSize:"11px",color:"var(--mid)"}},a))});
      afilSection.appendChild(pills);card.appendChild(afilSection);
    }
    wrap.appendChild(card);
  }

  // Link personal
  const myRef=localStorage.getItem("halime_my_ref")||(S.me&&S.me.ref_code)||null;
  if(S.me&&myRef){
    const baseUrl=window.location.origin+window.location.pathname;
    const refLink=baseUrl+"?ref="+encodeURIComponent(myRef);
    const linkBox=el("div",{style:{background:"linear-gradient(135deg,rgba(201,169,110,.10),rgba(194,96,122,.06))",border:"1px solid rgba(201,169,110,.28)",borderRadius:"16px",padding:"18px 18px",marginTop:"12px",width:"100%"}});
    linkBox.appendChild(el("div",{style:{fontSize:"10px",letterSpacing:"2px",textTransform:"uppercase",color:"var(--gold)",marginBottom:"8px"}},"Tu link personal"));
    linkBox.appendChild(el("div",{style:{fontSize:"13px",color:"var(--mid)",marginBottom:"12px",lineHeight:"1.6"}},"¡Mandá este link a tus amigos y familia para que te ayuden a sumar puntos! Cada uno que vote con 5 ★ suma 1 punto más a tu posición."));
    const linkText=el("div",{style:{fontSize:"11px",color:"var(--soft)",wordBreak:"break-all",marginBottom:"12px",lineHeight:"1.5",background:"rgba(255,255,255,.6)",padding:"8px 10px",borderRadius:"8px"}},refLink);
    linkBox.appendChild(linkText);
    const copyBtn=el("button",{cls:"btn-confirm-active",style:{width:"100%",padding:"15px",fontSize:"15px",fontWeight:"600",letterSpacing:".5px"}},"📋  Copiar mi link y compartir");
    copyBtn.addEventListener("click",()=>{navigator.clipboard.writeText(refLink);copyBtn.textContent="✓  ¡Link copiado!";setTimeout(()=>copyBtn.textContent="📋  Copiar mi link y compartir",2500)});
    linkBox.appendChild(copyBtn);wrap.appendChild(linkBox);
  }

  const actions=el("div",{cls:"rank-actions",style:{marginTop:"12px"}});
  if(!S.me){const joinBtn=el("button",{cls:"btn-primary"},"Participar");joinBtn.addEventListener("click",()=>set({page:"register",regStep:1}));actions.appendChild(joinBtn)}
  const refBtn=el("button",{cls:"btn-actualizar",style:{width:"100%",maxWidth:"440px",padding:"14px",borderRadius:"var(--r-xl)",border:"none",background:"linear-gradient(135deg,#c9a96e,#a07840)",color:"#fff",fontSize:"14px",fontWeight:"500",cursor:"pointer",fontFamily:"'DM Sans',sans-serif",letterSpacing:".3px",transition:"opacity .2s"}},"Actualizar ranking");
  refBtn.addEventListener("click",async()=>{refBtn.textContent="Actualizando…";refBtn.style.opacity=".7";try{const all=await sbGet("?order=puntos.desc");const myId=localStorage.getItem("halime_my_id");const me=myId?all.find(p=>String(p.id)===myId)||S.me:S.me;set({all,me})}catch{refBtn.textContent="Actualizar ranking";refBtn.style.opacity="1";toast("Error al actualizar.")}});
  actions.appendChild(refBtn);wrap.appendChild(actions);
  const backBtn=el("button",{cls:"btn-secondary",style:{width:"100%",maxWidth:"440px",marginTop:"8px"}},"← Inicio");
  backBtn.addEventListener("click",()=>set({page:"landing"}));
  wrap.appendChild(backBtn);
  return wrap;
}

function historyView(){
  const wrap=el("div",{style:{width:"100%",maxWidth:"440px"}});
  wrap.appendChild(el("h2",{cls:"hist-title"},"Mi historial"));
  if(!S.me){wrap.appendChild(el("p",{cls:"hist-sub"},"Registrate para ver tu historial de actividad."));const btn=el("button",{cls:"btn-primary"},"Registrarme");btn.addEventListener("click",()=>set({page:"register"}));wrap.appendChild(btn);return wrap}
  wrap.appendChild(el("p",{cls:"hist-sub"},S.me.nombre+" "+S.me.apellido+" · "+String(S.me.puntos||0)+" puntos totales"));
  const myItem=el("div",{cls:"hist-item"});
  myItem.appendChild(el("div",{cls:"hist-icon vote"},"⭐"));
  const mb=el("div",{cls:"hist-body"});
  mb.appendChild(el("div",{cls:"hist-label"},"Tu voto en Google"));

function pageAddAfiliados(){

  const newAfils=[""];

  function renderNew(){
    list.innerHTML="";
    newAfils.forEach((val,i)=>{
      const row=el("div",{cls:"afiliado-row"});
      row.appendChild(el("span",{cls:"afiliado-num"},String((S.me.afiliados||[]).length+i+1)));
      const inp=el("input",{cls:"finp",type:"text",placeholder:"Nombre y apellido"});
      inp.value=val;inp.addEventListener("input",ev=>newAfils[i]=ev.target.value);row.appendChild(inp);
      if(newAfils.length>1){const del=el("button",{cls:"btn-del"},"×");del.addEventListener("click",()=>{newAfils.splice(i,1);renderNew()});row.appendChild(del)}
      list.appendChild(row);
    });
    setTimeout(()=>{const inps=list.querySelectorAll(".finp");if(inps.length)inps[inps.length-1].focus()},30);
  }
  renderNew();card.appendChild(list);
  const addMore=el("button",{cls:"btn-add"},"+ Agregar otra persona");

    saveBtn.textContent="Guardando…";saveBtn.disabled=true;
    try{
      const updAfils=[...(S.me.afiliados||[]),...validos];
      const updPts=1+updAfils.length;
      await sbUpdate(S.me.id,{afiliados:updAfils,puntos:updPts});
      const all=await sbGet("?order=id.asc");
      const me={...S.me,afiliados:updAfils,puntos:updPts};
      const allUpd=all.map(p=>p.id===me.id?me:p);
      set({me,all:allUpd,page:"ranking",tab:"ranking"});

  });

  card.appendChild(back);page.appendChild(card);
  document.getElementById("root").innerHTML="";document.getElementById("root").appendChild(page);
}

function pageAdmin(){
  const sorted=[...S.all].sort((a,b)=>(b.puntos||0)-(a.puntos||0));
  const totalAfils=sorted.reduce((s,p)=>(p.afiliados||[]).length+s,0);
  function csv(){const cols=["Posición","Nombre","Apellido","Puntos","Afiliados","Fecha"];const rows=sorted.map((p,i)=>[i+1,p.nombre,p.apellido,p.puntos||0,(p.afiliados||[]).join(" | "),p.ts?new Date(p.ts).toLocaleDateString("es-AR"):""]);const csvRows=[cols.join(","),...rows.map(r=>r.join(","))];const blob=new Blob(["\uFEFF"+csvRows.join("\n")],{type:"text/csv;charset=utf-8;"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="concurso_halime.csv";a.click()}
  async function refresh(){try{const all=await sbGet("?order=puntos.desc");set({all})}catch{toast("Error al actualizar.")}}
  const page=el("div",{cls:"adm-page"});
  const hdr=el("div",{cls:"adm-hdr"});
  const hl=el("div",{cls:"adm-hdr-left"});

  const hbtns=el("div",{cls:"adm-btns"});
  const rb=el("button",{cls:"adm-btn"},"↻  Actualizar");rb.addEventListener("click",refresh);
  const cb=el("button",{cls:"adm-btn adm-btn-gold"},"⬇  Exportar CSV");cb.addEventListener("click",csv);
  const out=el("button",{cls:"adm-btn"},"Cerrar sesión");out.addEventListener("click",()=>set({page:"landing",adminAuth:false}));
  hbtns.appendChild(rb);hbtns.appendChild(cb);hbtns.appendChild(out);hdr.appendChild(hbtns);page.appendChild(hdr);
  const body=el("div",{cls:"adm-body"});
  const stats=el("div",{cls:"adm-stats"});
  [[String(sorted.length),"Participantes","#c2607a"],[String(totalAfils),"Afiliados totales","#c9a96e"],[sorted.length?String(sorted[0].nombre+" "+sorted[0].apellido):"—","Líder actual","#9b7fa6"],[sorted.length?String(sorted[0].puntos||0)+" pts":"—","Puntaje líder","#c9a96e"]].forEach(([v,l,c])=>{const sc=el("div",{cls:"adm-stat"});sc.appendChild(el("div",{cls:"adm-stat-val",style:{color:c}},v));sc.appendChild(el("div",{cls:"adm-stat-lbl"},l));stats.appendChild(sc)});
  body.appendChild(stats);
  const sec=el("div",{cls:"adm-section"});
  sec.appendChild(el("div",{cls:"adm-section-title"},"Ranking completo · "+String(sorted.length)+" participantes"));
  if(!sorted.length){sec.appendChild(el("div",{style:{textAlign:"center",padding:"32px",color:"var(--soft)",fontSize:"14px"}},"Aún no hay participantes."))}
  else{sorted.forEach((p,i)=>{const row=el("div",{cls:"adm-row"});const posClass=i===0?"gold":i===1?"silver":i===2?"bronze":"";row.appendChild(el("div",{cls:"adm-pos "+posClass},String(i+1)));const info=el("div",{cls:"adm-info"});info.appendChild(el("div",{cls:"adm-name"},p.nombre+" "+p.apellido));const afilWrap=el("div",{style:{marginTop:"6px"}});if((p.afiliados||[]).length){(p.afiliados||[]).forEach(a=>{afilWrap.appendChild(el("span",{cls:"adm-afil-item"},"👤 "+a))})}else{afilWrap.appendChild(el("span",{style:{fontSize:"11px",color:"var(--nude-dk)"}},"Sin afiliados"))}info.appendChild(afilWrap);info.appendChild(el("div",{cls:"adm-date"},p.ts?new Date(p.ts).toLocaleDateString("es-AR"):""));const del=el("button",{cls:"adm-del"},"🗑 Eliminar");del.addEventListener("click",async()=>{if(!confirm("¿Eliminar a "+p.nombre+" "+p.apellido+"? No se puede deshacer."))return;try{await sbDeleteParticipante(p.id);const updated=S.all.filter(x=>x.id!==p.id);set({all:updated});toast("Participante eliminado.")}catch{toast("Error al eliminar.")}});info.appendChild(del);const editBtn=el("button",{cls:"adm-edit"},"✏ Editar afiliados");editBtn.addEventListener("click",()=>showEditModal(p));info.appendChild(editBtn);row.appendChild(info);const pts=el("div",{cls:"adm-pts"});pts.appendChild(el("div",{cls:"adm-pts-val"},String(p.puntos||0)));pts.appendChild(el("div",{cls:"adm-pts-lbl"},"puntos"));row.appendChild(pts);sec.appendChild(row)})}
  body.appendChild(sec);body.appendChild(el("div",{style:{height:"32px"}}));page.appendChild(body);return page;
}

function pageRefRegister(){
  const page=el("div",{cls:"ref-page"});
  page.appendChild(logoHeader());
  const card=el("div",{cls:"card"});
  card.appendChild(el("h2",{cls:"reg-title"},"Confirmá tu voto"));
  card.appendChild(el("p",{cls:"reg-sub"},"Ingresá tu nombre completo para registrar tu punto."));
  card.appendChild(el("div",{cls:"section-title"},"Tus datos"));
  const LF={nombre:"",apellido:""};
  const fgN=el("div",{cls:"fg"});fgN.appendChild(el("label",{cls:"flabel"},"Tu nombre"));const inpN=el("input",{cls:"finp",type:"text",placeholder:"Nombre"});inpN.addEventListener("input",ev=>LF.nombre=ev.target.value);fgN.appendChild(inpN);card.appendChild(fgN);
  const fgA=el("div",{cls:"fg"});fgA.appendChild(el("label",{cls:"flabel"},"Tu apellido"));const inpA=el("input",{cls:"finp",type:"text",placeholder:"Apellido"});inpA.addEventListener("input",ev=>LF.apellido=ev.target.value);fgA.appendChild(inpA);card.appendChild(fgA);
  const btn=el("button",{cls:"btn-primary",style:{marginTop:"20px"}},"Registrar mi voto");
  btn.addEventListener("click",async()=>{
    if(!LF.nombre.trim()||!LF.apellido.trim()){toast("Ingresá tu nombre y apellido.");return}
    btn.textContent="Guardando…";btn.disabled=true;
    try{
      const owner=S.refOwner;const afilName=LF.nombre.trim()+" "+LF.apellido.trim();const afilNomLow=LF.nombre.trim().toLowerCase();const afilApeLow=LF.apellido.trim().toLowerCase();
      const allParts=await sbGet("?order=id.asc");
      const isDupBase=allParts.find(p=>p.nombre.toLowerCase()===afilNomLow&&p.apellido.toLowerCase()===afilApeLow);
      if(isDupBase){btn.textContent="Registrar mi voto";btn.disabled=false;toast("Este nombre ya está registrado como participante.");return}
      const isDupAfil=allParts.find(p=>(p.afiliados||[]).some(a=>{const parts=a.trim().split(" ");const aNom=parts[0]?.toLowerCase()||"";const aApe=parts.slice(1).join(" ").toLowerCase()||"";return aNom===afilNomLow&&aApe===afilApeLow}));
      if(isDupAfil){btn.textContent="Registrar mi voto";btn.disabled=false;toast("Este nombre ya confirmó su voto anteriormente.");return}
      const updAfils=[...(owner.afiliados||[]),afilName];const updPts=1+updAfils.length;
      await sbUpdate(owner.id,{afiliados:updAfils,puntos:updPts});
      localStorage.setItem("halime_ref_done_"+S.refCode,"1");
      set({page:"ref-done",refOwner:{...owner,afiliados:updAfils,puntos:updPts}});
      setTimeout(launchConfetti,200);
    } catch(e){btn.textContent="Registrar mi voto";btn.disabled=false;toast("Error: "+e.message)}
  });
  card.appendChild(btn);page.appendChild(card);return page;
}

function launchConfetti(){
  const colors=["#c9a96e","#c2607a","#f5c4b3","#e8a0bb","#fff","#f5ede0","#e0d4c8"];
  for(let i=0;i<120;i++){const el=document.createElement("div");el.className="confetti-piece";el.style.left=Math.random()*100+"vw";el.style.background=colors[Math.floor(Math.random()*colors.length)];el.style.width=(6+Math.random()*8)+"px";el.style.height=(6+Math.random()*8)+"px";el.style.borderRadius=Math.random()>0.5?"50%":"2px";el.style.animationDuration=(1.5+Math.random()*2.5)+"s";el.style.animationDelay=(Math.random()*1.2)+"s";document.body.appendChild(el);el.addEventListener("animationend",()=>el.remove())}
}

function showEditModal(p){
  const existing=document.getElementById("_edit_modal");if(existing)existing.remove();
  const afils=[...(p.afiliados||[])];
  const overlay=document.createElement("div");overlay.className="modal-overlay";overlay.id="_edit_modal";
  const card=document.createElement("div");card.className="modal-card";
  const title=document.createElement("div");title.className="modal-title";title.textContent="Editar afiliados";card.appendChild(title);
  const sub=document.createElement("div");sub.className="modal-sub";
  function updateSub(){sub.textContent=p.nombre+" "+p.apellido+" · "+afils.length+" afiliado"+(afils.length!==1?"s":"")}
  updateSub();card.appendChild(sub);
  const listEl=document.createElement("div");
  function renderList(){listEl.innerHTML="";afils.forEach((a,i)=>{const row=document.createElement("div");row.className="modal-afil-row";const inp=document.createElement("input");inp.className="modal-afil-inp";inp.value=a;inp.addEventListener("input",ev=>{afils[i]=ev.target.value});const del=document.createElement("button");del.className="modal-afil-del";del.textContent="×";del.addEventListener("click",()=>{afils.splice(i,1);renderList();updateSub()});row.appendChild(inp);row.appendChild(del);listEl.appendChild(row)})}
  renderList();card.appendChild(listEl);
  const addBtn=document.createElement("button");addBtn.className="modal-add";addBtn.textContent="+ Agregar afiliado";addBtn.addEventListener("click",()=>{afils.push("");renderList();updateSub()});card.appendChild(addBtn);
  const btns=document.createElement("div");btns.className="modal-btns";
  const cancelBtn=document.createElement("button");cancelBtn.className="modal-cancel";cancelBtn.textContent="Cancelar";cancelBtn.addEventListener("click",()=>overlay.remove());
  const saveBtn=document.createElement("button");saveBtn.className="modal-save";saveBtn.textContent="Guardar cambios";
  saveBtn.addEventListener("click",async()=>{const validAfils=afils.map(a=>a.trim()).filter(a=>a);saveBtn.textContent="Guardando…";saveBtn.disabled=true;try{const newPts=1+validAfils.length;await sbUpdate(p.id,{afiliados:validAfils,puntos:newPts});const updated=S.all.map(x=>x.id===p.id?{...x,afiliados:validAfils,puntos:newPts}:x);set({all:updated});overlay.remove();toast("Afiliados actualizados.")}catch(e){saveBtn.textContent="Guardar cambios";saveBtn.disabled=false;toast("Error: "+e.message)}});
  btns.appendChild(cancelBtn);btns.appendChild(saveBtn);card.appendChild(btns);
  overlay.appendChild(card);overlay.addEventListener("click",ev=>{if(ev.target===overlay)overlay.remove()});
  document.body.appendChild(overlay);
}

function R(){
  const root=document.getElementById("root");root.innerHTML="";
  if(S.page==="landing")root.appendChild(pageLanding());
  else if(S.page==="register")root.appendChild(pageRegister());
  else if(S.page==="ranking")root.appendChild(pageRanking());
  else if(S.page==="admin-login")root.appendChild(pageAdminLogin());
  else if(S.page==="admin")root.appendChild(pageAdmin());
  else if(S.page==="ref-invite")root.appendChild(pageRefInvite());
  else if(S.page==="ref-register")root.appendChild(pageRefRegister());
  else if(S.page==="ref-done")root.appendChild(pageRefDone());
}

async function initRoute(){
  const hash=window.location.hash;const params=new URLSearchParams(window.location.search);const refCode=params.get("ref");
  if(hash==="#admin"){S.page="admin-login";R();return}
  if(refCode){
    S.refCode=refCode;
    if(localStorage.getItem("halime_ref_done_"+refCode)){S.page="ref-done";R();return}
    try{const owner=await sbGetByRef(refCode);if(owner){S.refOwner=owner;S.page="ref-invite";R();return}}catch(e){}
  }
  if(localStorage.getItem("halime_registered")){
    try{const all=await sbGet("?order=puntos.desc");const myId=localStorage.getItem("halime_my_id");const me=myId?all.find(p=>String(p.id)===myId)||null:null;S.all=all;if(me)S.me=me}catch(e){}
  }
  R();
}
window.addEventListener("hashchange",()=>{if(window.location.hash==="#admin"&&S.page!=="admin"&&S.page!=="admin-login"){S.page="admin-login";R()}});
initRoute();
